name: Tests
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run local MQTT broker
        run: |
          docker run -d -p 1883:1883 -p 9001:9001 \
            -v ${{ github.workspace }}/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf \
            eclipse-mosquitto:2
      - name: Build docker image
        run: |
          docker build . \
            --build-arg TESTING_E2E='true' \
            --build-arg RELAY_URLS='ws://localhost:9001' \
            -t ${{ github.repository }}:${{ github.sha }}
      - name: Run docker container
        run: docker run -d -p 3000:3000 ${{ github.repository }}:${{ github.sha }}
      - name: Install playwright
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: ggshield
